<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>짤·카드 스튜디오</title>
<style>
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#f8f9fc;
  --surface-3:#eef1f7;
  --ink:#171a24;
  --muted:#72798b;
  --muted-2:#9aa1b2;
  --line:#e5e8f0;
  --line-strong:#d7dbe6;
  --primary:#635bff;
  --primary-dark:#5048e8;
  --primary-soft:#eeecff;
  --success:#14966b;
  --danger:#d94b4b;
  --shadow-sm:0 2px 8px rgba(27,32,52,.05);
  --shadow:0 10px 30px rgba(27,32,52,.08);
  --shadow-lg:0 18px 50px rgba(27,32,52,.12);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0e1017;--surface:#171a23;--surface-2:#1c202b;--surface-3:#222734;
    --ink:#f3f5fb;--muted:#9ca4b7;--muted-2:#727b91;
    --line:#292e3b;--line-strong:#363c4b;--primary:#8b83ff;--primary-dark:#766cff;
    --primary-soft:#29264c;--success:#43c998;--danger:#ff7777;
    --shadow-sm:0 2px 8px rgba(0,0,0,.16);--shadow:0 12px 30px rgba(0,0,0,.22);--shadow-lg:0 20px 55px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:
    radial-gradient(circle at 82% 8%,rgba(99,91,255,.07),transparent 24rem),
    var(--bg);
  color:var(--ink);
  font:14px/1.5 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  letter-spacing:-.01em;
}
button,input,select,textarea{font:inherit;color:inherit}
button{transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
button:active{transform:translateY(1px)}
:focus-visible{outline:3px solid rgba(99,91,255,.35);outline-offset:3px}

/* Top navigation */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  min-height:68px;padding:12px 22px;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
@media(prefers-color-scheme:dark){.top{background:rgba(23,26,35,.9)}}
.logo{
  display:flex;align-items:center;gap:9px;
  font-weight:800;font-size:17px;letter-spacing:-.035em;
  margin-right:12px;white-space:nowrap;
}
.logo::before{
  content:"✦";
  display:grid;place-items:center;
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,var(--primary),#8b7cff);
  color:#fff;font-size:14px;
  box-shadow:0 5px 14px rgba(99,91,255,.25);
}
.top .grp{
  display:flex;gap:3px;padding:3px;
  border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);
}
.grp button{
  border:0;border-radius:7px;
  background:transparent;padding:6px 13px;
  color:var(--muted);cursor:pointer;font-weight:600;
}
.grp button:hover{color:var(--ink);background:var(--surface)}
.grp button[aria-pressed=true]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.sp{flex:1}
.top .btn{white-space:nowrap}

/* Buttons */
.btn{
  border:1px solid var(--line-strong);
  background:var(--surface);
  border-radius:9px;padding:8px 12px;
  cursor:pointer;font-weight:600;
  box-shadow:0 1px 1px rgba(20,24,40,.02);
}
.btn:hover{background:var(--surface-2);border-color:#cbd0dc}
.btn.pri{
  background:var(--primary);color:#fff;border-color:var(--primary);
  box-shadow:0 6px 16px rgba(99,91,255,.22);
}
.btn.pri:hover{background:var(--primary-dark);border-color:var(--primary-dark);box-shadow:0 8px 20px rgba(99,91,255,.27)}
#fmt{
  border:1px solid var(--line-strong);
  border-radius:9px;padding:8px 28px 8px 10px;
  background:var(--surface);
}

/* Main shell */
main{
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  gap:18px;
  padding:20px;
  max-width:1440px;
  margin:0 auto;
}
@media(max-width:980px){main{grid-template-columns:280px minmax(0,1fr)}}
@media(max-width:820px){
  main{grid-template-columns:1fr;padding:14px}
  .top{padding:10px 14px}
  .top .sp{display:none}
  .top{flex-wrap:wrap}
}

/* Panels */
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:15px;
  box-shadow:var(--shadow-sm);
}
aside.panel{position:sticky;top:88px;align-self:start}
@media(max-width:820px){aside.panel{position:static}}
.panel section{
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.panel section:last-child{padding-bottom:0;border-bottom:0}
h2{
  display:flex;align-items:center;gap:7px;
  font-size:13px;font-weight:800;margin:0 0 10px;
  letter-spacing:-.02em;
}
h2::before{
  content:"";
  width:4px;height:14px;border-radius:99px;
  background:var(--primary);
}
label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
input[type=text],textarea,select{
  width:100%;
  border:1px solid var(--line-strong);
  border-radius:9px;
  padding:9px 10px;
  background:var(--surface-2);
  color:var(--ink);
  outline:0;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input[type=text]:focus,textarea:focus,select:focus{
  border-color:var(--primary);
  background:var(--surface);
  box-shadow:0 0 0 3px rgba(99,91,255,.10);
}
textarea{min-height:96px;resize:vertical;line-height:1.6}
input[type=range]{width:100%;accent-color:var(--primary);cursor:pointer}
input[type=color]{
  width:100%;height:38px;
  border:1px solid var(--line-strong);
  border-radius:9px;background:var(--surface-2);padding:3px;cursor:pointer;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{
  min-height:20px;padding:0 2px;
  font-size:12px;font-weight:700;
}
.msg.ok{color:var(--success)}
.msg.err{color:var(--danger)}
output{color:var(--ink);font-size:11px;font-weight:700;align-self:flex-end;margin-bottom:-2px}

/* Workspace */
.stage{
  min-height:540px;
  display:flex;justify-content:center;align-items:center;
  padding:30px;
  background:
    linear-gradient(45deg,var(--surface-3) 25%,transparent 25%,transparent 75%,var(--surface-3) 75%) 0 0/22px 22px,
    linear-gradient(45deg,var(--surface-3) 25%,transparent 25%,transparent 75%,var(--surface-3) 75%) 11px 11px/22px 22px,
    var(--surface-2);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.stage::before{
  content:"LIVE PREVIEW";
  position:absolute;left:16px;top:14px;
  padding:4px 8px;border-radius:6px;
  background:rgba(255,255,255,.78);
  color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em;
  box-shadow:0 1px 5px rgba(0,0,0,.05);
}
@media(prefers-color-scheme:dark){.stage::before{background:rgba(23,26,35,.78)}}
#cv{
  max-width:100%;max-height:68vh;width:auto;height:auto;
  border-radius:5px;
  box-shadow:0 18px 45px rgba(20,24,40,.18),0 0 0 1px rgba(20,24,40,.08);
  touch-action:none;cursor:move;background:#fff;
}

/* Template manager */
.manager{padding:17px}
.manager h2{margin-bottom:1px}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.card{
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px;
  display:flex;flex-direction:column;gap:8px;
  background:var(--surface);
  transition:transform .16s,box-shadow .16s,border-color .16s;
}
.card:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--shadow)}
.card .th{
  height:126px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border-radius:8px;overflow:hidden;
  border:1px solid var(--line);
}
.card .th img{max-width:100%;max-height:100%;display:block}
.card b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;padding:0 2px}
.card .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.card .acts .btn{padding:6px 2px;font-size:11px;box-shadow:none}
.btn.del.arm{background:var(--danger);color:#fff;border-color:var(--danger)}
small{font-size:11px;line-height:1.5}

/* Footer */
footer{
  max-width:1440px;margin:0 auto;
  padding:2px 20px 28px;
  color:var(--muted);font-size:11px;line-height:1.7;
}
@media(max-width:820px){footer{padding:0 14px 22px}}

/* Upload control */
input[type=file]{
  width:100%;font-size:11px;color:var(--muted);
}
input[type=file]::file-selector-button{
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink);
  border-radius:8px;
  padding:7px 10px;
  margin-right:8px;
  cursor:pointer;
  font-weight:700;
}
input[type=file]::file-selector-button:hover{background:var(--primary-soft);border-color:rgba(99,91,255,.35);color:var(--primary)}

</style>
</head>
<body>
<header class="top">
  <span class="logo">짤·카드 스튜디오</span>
  <div class="grp" role="group" aria-label="화면비">
    <button data-r="1:1" aria-pressed="true">1:1</button><button data-r="4:5" aria-pressed="false">4:5</button><button data-r="9:16" aria-pressed="false">9:16</button>
  </div>
  <span class="sp"></span>
  <button class="btn" id="imp">JSON 불러오기</button>
  <button class="btn" id="exp">JSON 내보내기</button>
  <select id="fmt" aria-label="다운로드 형식"><option value="png">PNG</option><option value="jpeg">JPEG</option></select>
  <button class="btn pri" id="dl">다운로드</button>
  <input type="file" id="jf" accept=".json,application/json" hidden>
</header>

<main>
  <aside class="panel">
    <section>
      <h2>1. 이미지</h2>
      <label>PNG · JPEG 파일 선택<input type="file" id="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg"></label>
    </section>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2>2. 문구</h2>
      <label>문구 (줄바꿈·이모지 가능)<textarea id="tx" maxlength="500"></textarea></label>
      <label>글자 크기 <output id="szo"></output><input type="range" id="sz" min="20" max="240"></label>
      <label>글자 색상<input type="color" id="co"></label>
      <label>외곽선 두께 <output id="oo"></output><input type="range" id="ol" min="0" max="20" step="1" value="15"></label>
      <div class="row">
        <label>X 위치 <output id="xo"></output><input type="range" id="px" min="0" max="100"></label>
        <label>Y 위치 <output id="yo"></output><input type="range" id="py" min="0" max="100"></label>
      </div>
      <small style="color:var(--muted)">↗ 캔버스를 직접 드래그해서 문구 위치를 조절할 수 있어요.</small>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px">
      <h2>3. 템플릿</h2>
      <input type="text" id="tn" maxlength="40" placeholder="템플릿 이름" aria-label="템플릿 이름">
      <button class="btn pri" id="sv">현재 상태를 템플릿으로 저장</button>
    </section>
  </aside>

  <section class="workspace" style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <div class="stage"><canvas id="cv" aria-label="미리보기"></canvas></div>
    <div class="panel manager"><h2>템플릿 관리 <span id="cnt" style="color:var(--mute);font-weight:400"></span></h2><div class="tl" id="tl"></div></div>
  </section>
</main>
<footer>🔒 이미지는 이 브라우저 안에서만 처리되며 서버로 전송되지 않습니다. 업로드한 이미지는 Canvas로 다시 인코딩되어 EXIF(GPS 포함) 정보가 제거됩니다. 기본 배경은 코드로 만든 그라데이션이며, 업로드 이미지의 출처와 라이선스는 사용자에게 있습니다.</footer>

<script>
const RATIOS={'1:1':[1080,1080],'4:5':[1080,1350],'9:16':[1080,1920]};
const FONT='"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const KEY='t03.templates.v1';
const OUT_DEF=15,OUT_MAX=20;
const $=s=>document.querySelector(s);
const S={ratio:'1:1',text:'여기에 문구를 입력하세요 ✨',size:88,color:'#ffffff',x:50,y:50,outline:15,img:null};
let imgEl=null,T=[];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const clean=t=>String(t).replace(/[\u0000-\u0009\u000B-\u001F\u007F]/g,'').slice(0,500);
const lum=h=>(.299*parseInt(h.slice(1,3),16)+.587*parseInt(h.slice(3,5),16)+.114*parseInt(h.slice(5,7),16))/255;
const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>i.width&&i.height?ok(i):no();i.onerror=no;i.src=u});

let mt;function msg(t,k){const m=$('#msg');m.textContent=t;m.className='msg '+k;clearTimeout(mt);mt=setTimeout(()=>{m.textContent=''},5000)}

/* ---------- 렌더링 (미리보기·다운로드·썸네일이 같은 함수 사용) ---------- */
function render(cv,w,h,st,im){
  cv.width=w;cv.height=h;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,w,h);
  if(im){const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;c.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh)}
  else{const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#ff8a5c');g.addColorStop(1,'#6a3cff');c.fillStyle=g;c.fillRect(0,0,w,h)}
  if(!st.text.trim())return;
  const fs=st.size*w/1080;
  c.font=`700 ${fs}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';
  const maxW=w*.9,lines=[];
  for(const para of st.text.split('\n')){
    let cur='';
    for(const tok of para.match(/[\w'’-]+|[\s\S]/gu)||[]){
      if(cur&&c.measureText(cur+tok).width>maxW){lines.push(cur.trimEnd());cur=tok.trim()?tok:''}else cur+=tok;
      while(cur.length>1&&c.measureText(cur).width>maxW){let i=cur.length-1;while(i>1&&c.measureText(cur.slice(0,i)).width>maxW)i--;lines.push(cur.slice(0,i));cur=cur.slice(i)}
    }
    lines.push(cur);
  }
  const lh=fs*1.3,top=h*st.y/100-(lines.length-1)*lh/2;
  const ow=Math.min(OUT_MAX,Math.max(0,Number.isFinite(st.outline)?st.outline:OUT_DEF))*w/1080;
  c.lineJoin='round';c.lineWidth=ow;c.strokeStyle=lum(st.color)>.55?'rgba(0,0,0,.55)':'rgba(255,255,255,.75)';c.fillStyle=st.color;
  lines.forEach((l,i)=>{const x=w*st.x/100,y=top+i*lh;if(ow>0)c.strokeText(l,x,y);c.fillText(l,x,y)});
}
const draw=()=>{const[w,h]=RATIOS[S.ratio];render($('#cv'),w,h,S,imgEl)};

function sync(){
  $('#tx').value=S.text;$('#sz').value=S.size;$('#co').value=S.color;$('#px').value=S.x;$('#py').value=S.y;$('#ol').value=S.outline;$('#oo').textContent=S.outline+'px';
  $('#szo').textContent=S.size+'px';$('#xo').textContent=Math.round(S.x)+'%';$('#yo').textContent=Math.round(S.y)+'%';
  document.querySelectorAll('[data-r]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===S.ratio));
}

/* ---------- 입력 ---------- */
$('#tx').oninput=e=>{S.text=clean(e.target.value);draw()};
$('#sz').oninput=e=>{S.size=+e.target.value;sync();draw()};
$('#co').oninput=e=>{S.color=e.target.value;draw()};
$('#ol').oninput=e=>{S.outline=+e.target.value;sync();draw()};
$('#px').oninput=e=>{S.x=+e.target.value;sync();draw()};
$('#py').oninput=e=>{S.y=+e.target.value;sync();draw()};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.ratio=b.dataset.r;sync();draw()});
const cv=$('#cv');let drag=false;
function mv(e){const r=cv.getBoundingClientRect();S.x=Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100));S.y=Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100));sync();draw()}
cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);mv(e)};
cv.onpointermove=e=>{if(drag)mv(e)};
cv.onpointerup=cv.onpointercancel=()=>{drag=false};

/* ---------- 이미지 업로드 (실패해도 기존 상태 유지) ---------- */
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    if(f.size>15*1024*1024)throw'파일이 너무 큽니다. 15MB 이하만 올릴 수 있어요.';
    const b=new Uint8Array(await f.slice(0,8).arrayBuffer());
    const png=b[0]==0x89&&b[1]==0x50&&b[2]==0x4e&&b[3]==0x47,jpg=b[0]==0xff&&b[1]==0xd8&&b[2]==0xff;
    if(!png&&!jpg)throw'지원하지 않는 파일 형식입니다. PNG 또는 JPEG만 올릴 수 있어요.';
    const raw=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
    const im=await loadImg(raw);
    const k=Math.min(1,1600/Math.max(im.width,im.height)),t=document.createElement('canvas');
    t.width=Math.max(1,Math.round(im.width*k));t.height=Math.max(1,Math.round(im.height*k));
    t.getContext('2d').drawImage(im,0,0,t.width,t.height);
    const data=t.toDataURL(png?'image/png':'image/jpeg',.9);
    imgEl=await loadImg(data);S.img=data;draw();msg('이미지를 불러왔어요. 위치 정보(EXIF)는 제거됩니다.','ok');
  }catch(err){msg(typeof err==='string'?err:'이미지를 읽을 수 없어요. 기존 작업은 그대로 유지됩니다.','err')}
  e.target.value='';
};

/* ---------- 다운로드 / 파일 저장 ---------- */
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#dl').onclick=async()=>{
  try{
    await document.fonts.ready;
    const[w,h]=RATIOS[S.ratio],c=document.createElement('canvas'),f=$('#fmt').value;
    render(c,w,h,S,imgEl);
    c.toBlob(b=>{if(!b)return msg('이미지를 만들지 못했어요.','err');save(b,`card-${S.ratio.replace(':','x')}-${Date.now()}.${f==='png'?'png':'jpg'}`);msg('다운로드를 시작했어요.','ok')},'image/'+f,.95);
  }catch{msg('다운로드에 실패했어요.','err')}
};

/* ---------- 템플릿 (localStorage CRUD) ---------- */
const IMGRE=/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/;
function valid(t){
  const o=t&&typeof t==='object'?t:null;if(!o)throw'템플릿 형식이 올바르지 않아요.';
  const num=(v,a,b,n)=>{if(typeof v!=='number'||!isFinite(v)||v<a||v>b)throw`"${n}" 값이 올바르지 않아요.`;return v};
  if(typeof o.name!=='string'||!o.name.trim()||o.name.length>40)throw'필수 항목 "name"이 없거나 올바르지 않아요.';
  if(typeof o.text!=='string')throw'필수 항목 "text"가 없어요.';
  if(!RATIOS[o.ratio])throw'"ratio"는 1:1, 4:5, 9:16 중 하나여야 해요.';
  if(typeof o.color!=='string'||!/^#[0-9a-f]{6}$/i.test(o.color))throw'"color" 값이 올바르지 않아요.';
  let ol=OUT_DEF;if(o.outline!=null)ol=Math.round(num(o.outline,0,OUT_MAX,'outline'));
  if(o.img!=null&&(typeof o.img!=='string'||!IMGRE.test(o.img)))throw'"img" 값이 올바르지 않아요.';
  return{id:typeof o.id==='string'&&o.id?o.id.slice(0,64):uid(),name:o.name.trim(),ratio:o.ratio,text:clean(o.text),size:num(o.size,20,240,'size'),color:o.color.toLowerCase(),x:num(o.x,0,100,'x'),y:num(o.y,0,100,'y'),outline:ol,img:o.img||null};
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(T));return true}catch{return false}}
function loadStore(){
  try{const r=localStorage.getItem(KEY);if(r!==null){const a=JSON.parse(r);if(Array.isArray(a)){T=a.map(x=>{try{return valid(x)}catch{return null}}).filter(Boolean);return}}}catch{}
  T=[['기본 밈','1:1','오늘도 출근 완료 😎',90,'#ffffff',50,50],['카드뉴스 제목','4:5','3분 만에 보는\n전파 이야기',96,'#ffe066',50,40],['스토리 문구','9:16','저장하고\n나중에 보기 📌',84,'#ffffff',50,75]]
   .map(([name,ratio,text,size,color,x,y])=>({id:uid(),name,ratio,text,size,color,x,y,outline:OUT_DEF,img:null}));
  persist();
}
async function shrink(){
  if(!imgEl)return null;
  const k=Math.min(1,1080/Math.max(imgEl.width,imgEl.height)),t=document.createElement('canvas');
  t.width=Math.max(1,Math.round(imgEl.width*k));t.height=Math.max(1,Math.round(imgEl.height*k));
  t.getContext('2d').drawImage(imgEl,0,0,t.width,t.height);
  return t.toDataURL(S.img&&S.img.startsWith('data:image/png')?'image/png':'image/jpeg',.85);
}
const snap=async(id,name)=>({id,name,ratio:S.ratio,text:S.text,size:S.size,color:S.color,x:S.x,y:S.y,outline:S.outline,img:await shrink()});
async function commit(next,okMsg){
  const prev=T;T=next;
  if(!persist()){
    const lite=next.map(t=>({...t,img:null}));T=lite;
    if(!persist()){T=prev;msg('브라우저 저장 공간이 부족해 저장하지 못했어요.','err');return}
    msg('저장 공간이 부족해 이미지 없이 문구·스타일만 저장했어요.','err');
  }else msg(okMsg,'ok');
  list();
}
$('#sv').onclick=async()=>{
  const n=$('#tn').value.trim()||`템플릿 ${T.length+1}`;
  await commit([...T,await snap(uid(),n.slice(0,40))],'템플릿을 저장했어요.');$('#tn').value='';
};
const thumbs=new Map();
async function thumb(t){
  const k=t.id+t.ratio+t.text+t.size+t.color+t.x+t.y+t.outline+(t.img?t.img.length:0);
  if(thumbs.has(k))return thumbs.get(k);
  const im=t.img?await loadImg(t.img).catch(()=>null):null,w=180,h=Math.round(w*RATIOS[t.ratio][1]/1080),c=document.createElement('canvas');
  render(c,w,h,t,im);const u=c.toDataURL('image/jpeg',.7);thumbs.set(k,u);return u;
}
function list(){
  const box=$('#tl');box.textContent='';$('#cnt').textContent=`(${T.length}개)`;
  if(!T.length){box.textContent='저장된 템플릿이 없어요. 왼쪽에서 현재 상태를 저장해 보세요.';return}
  T.forEach(t=>{
    const d=document.createElement('div');d.className='card';
    const th=document.createElement('div');th.className='th';const im=document.createElement('img');im.alt=t.name;th.appendChild(im);thumb(t).then(u=>{im.src=u});
    const b=document.createElement('b');b.textContent=t.name;b.title=t.name;
    const a=document.createElement('div');a.className='acts';
    const mk=(l,f,c='')=>{const x=document.createElement('button');x.className='btn '+c;x.textContent=l;x.onclick=f;a.appendChild(x);return x};
    mk('불러오기',()=>apply(t));
    mk('수정',async()=>{const n=($('#tn').value.trim()||t.name).slice(0,40);const u=await snap(t.id,n);await commit(T.map(x=>x.id===t.id?u:x),'템플릿을 현재 상태로 수정했어요.');$('#tn').value='';});
    const del=mk('삭제',()=>{
      if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='정말 삭제?';setTimeout(()=>{del.classList.remove('arm');del.textContent='삭제'},3000);return}
      commit(T.filter(x=>x.id!==t.id),'템플릿을 삭제했어요.');
    },'del');
    d.append(th,b,a);box.appendChild(d);
  });
}
async function apply(t){
  try{
    const im=t.img?await loadImg(t.img):null;
    Object.assign(S,{ratio:t.ratio,text:t.text,size:t.size,color:t.color,x:t.x,y:t.y,outline:t.outline,img:t.img});imgEl=im;
    sync();draw();msg(`"${t.name}" 템플릿을 불러왔어요.`,'ok');
  }catch{msg('템플릿 이미지를 읽을 수 없어요. 기존 작업은 유지됩니다.','err')}
}

/* ---------- JSON 내보내기 / 불러오기 ---------- */
$('#exp').onclick=()=>{
  if(!T.length)return msg('내보낼 템플릿이 없어요.','err');
  save(new Blob([JSON.stringify({app:'jjal-card-studio',version:1,templates:T},null,2)],{type:'application/json'}),`templates-${Date.now()}.json`);
  msg('JSON 파일을 내보냈어요.','ok');
};
$('#imp').onclick=()=>$('#jf').click();
$('#jf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    if(f.size>8*1024*1024)throw'JSON 파일이 너무 커요. (최대 8MB)';
    let o;try{o=JSON.parse(await f.text())}catch{throw'JSON 형식이 손상되어 있어요.'}
    if(!o||o.app!=='jjal-card-studio'||!Array.isArray(o.templates))throw'필수 항목(app, templates)이 없어요.';
    if(!o.templates.length||o.templates.length>50)throw'템플릿은 1~50개여야 해요.';
    const items=o.templates.map(valid);
    await Promise.all(items.filter(t=>t.img).map(t=>loadImg(t.img).catch(()=>{throw'템플릿 이미지를 읽을 수 없어요.'})));
    const have=new Set(T.map(t=>t.id));
    items.forEach(t=>{if(have.has(t.id))t.id=uid();have.add(t.id)});
    await commit([...T,...items],`템플릿 ${items.length}개를 불러왔어요.`);
  }catch(err){msg((typeof err==='string'?err:'불러오지 못했어요.')+' 기존 목록은 그대로 유지됩니다.','err')}
};

loadStore();sync();draw();list();
document.fonts&&document.fonts.ready.then(draw);
</script>
</body>
</html>
